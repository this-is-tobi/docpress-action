name: Test Docpress Action

on:
  workflow_call:
    inputs:
      ACRONYMS:
        type: string
        required: false
      ARTIFACT_NAME:
        type: string
        required: false
        default: github-pages
      BRANCH:
        type: string
        required: false
      CONFIG:
        type: string
        required: false
      CONTRIBUTIONS:
        type: boolean
        required: false
        default: false
      CONTRIBUTIONS_FILTER:
        type: string
        required: false
      DEPLOY:
        type: boolean
        required: false
        default: false
      EXPECTED_FILES:
        description: Space-separated files the build must generate, relative to docpress/.vitepress/dist.
        type: string
        required: true
      EXTRA_HEADER_PAGES:
        type: string
        required: false
      EXTRA_PUBLIC_CONTENT:
        type: string
        required: false
      EXTRA_THEME:
        type: string
        required: false
      GIT_PROVIDER:
        type: string
        required: false
      LAST_UPDATED:
        type: boolean
        required: false
        default: false
      LOG_LEVEL:
        type: string
        required: false
      REPOS_FILTER:
        type: string
        required: false
      SIDEBAR_COLLAPSED:
        type: string
        required: false
      SIDEBAR_MODE:
        type: string
        required: false
      USERNAMES:
        type: string
        required: false
      VITEPRESS_CONFIG:
        type: string
        required: false
      WEBSITE_TAGLINE:
        type: string
        required: false
      WEBSITE_TITLE:
        type: string
        required: false

jobs:
  test-docpress:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run Docpress action
      uses: ./
      with:
        acronyms: ${{ inputs.ACRONYMS }}
        artifactName: ${{ inputs.ARTIFACT_NAME }}
        branch: ${{ inputs.BRANCH }}
        config: ${{ inputs.CONFIG }}
        contributions: ${{ inputs.CONTRIBUTIONS }}
        contributionsFilter: ${{ inputs.CONTRIBUTIONS_FILTER }}
        deploy: ${{ inputs.DEPLOY }}
        extraHeaderPages: ${{ inputs.EXTRA_HEADER_PAGES }}
        extraPublicContent: ${{ inputs.EXTRA_PUBLIC_CONTENT }}
        extraTheme: ${{ inputs.EXTRA_THEME }}
        gitProvider: ${{ inputs.GIT_PROVIDER }}
        lastUpdated: ${{ inputs.LAST_UPDATED }}
        logLevel: ${{ inputs.LOG_LEVEL }}
        reposFilter: ${{ inputs.REPOS_FILTER }}
        sidebarCollapsed: ${{ inputs.SIDEBAR_COLLAPSED }}
        sidebarMode: ${{ inputs.SIDEBAR_MODE }}
        usernames: ${{ inputs.USERNAMES }}
        vitepressConfig: ${{ inputs.VITEPRESS_CONFIG }}
        websiteTagline: ${{ inputs.WEBSITE_TAGLINE }}
        websiteTitle: ${{ inputs.WEBSITE_TITLE }}

    - name: Verify generated output
      env:
        EXPECTED_FILES: ${{ inputs.EXPECTED_FILES }}
      run: |
        read -ra files <<< "$EXPECTED_FILES"
        missing=0
        for file in "${files[@]}"; do
          if [[ ! -f "docpress/.vitepress/dist/$file" ]]; then
            echo "::error::docpress/.vitepress/dist/$file was not generated."
            missing=1
          fi
        done
        exit "$missing"

    - name: Download artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.ARTIFACT_NAME }}
        path: /tmp/website
